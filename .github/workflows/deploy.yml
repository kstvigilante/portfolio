name: Portfolio CI/CD

on:
  push:
    branches:
      - main
      - feature/docker-cicd

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -t portfolio:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag portfolio:latest ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Test AWS Systems Manager access
        run: aws ssm describe-instance-information --region ap-southeast-2

      - name: Send test command to EC2
        run: |
          aws ssm send-command \
            --instance-ids "i-0f328916e19d129d9" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo Hello from GitHub Actions!"]}' \
            --region ap-southeast-2

      - name: Wait for test command
        run: |
          aws ssm wait command-executed \
            --command-id fd146a44-7357-41e5-b121-4036628551eb \
            --instance-id i-0f328916e19d129d9 \
            --region ap-southeast-2

      - name: Get test command output
        run: |
          aws ssm get-command-invocation \
            --command-id fd146a44-7357-41e5-b121-4036628551eb \
            --instance-id i-0f328916e19d129d9 \
            --region ap-southeast-2
